<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ksBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Orange-Gold Gradient -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Deep Precision Cyan-Blue Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#ksBg)" />

  <!-- Outer Precision Perimeter Ring -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.25" stroke-dasharray="16 8" />

  <!-- Main Shield Emblem Group with Drop Shadow -->
  <g filter="url(#badgeShadow)">
    <!-- Hexagonal Precision Shield -->
    <polygon points="256,44 436,118 436,324 256,454 76,324 76,118" fill="url(#shieldGrad)" stroke="#334155" stroke-width="6" />

    <!-- Inner Shield Accent Line -->
    <polygon points="256,62 418,128 418,314 256,432 94,314 94,128" fill="#0b1120" stroke="url(#blueGlow)" stroke-width="3" stroke-opacity="0.45" />

    <!-- Blueprint Construction / Architectural Gridlines -->
    <line x1="110" y1="236" x2="402" y2="236" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="256" y1="96" x2="256" y2="394" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="256" cy="236" r="114" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Stylized "KS" Monogram Typography -->
    <!-- "K" Letter -->
    <g>
      <!-- Vertical K Pillar -->
      <rect x="144" y="146" width="30" height="140" rx="5" fill="#ffffff" />
      <!-- K Upper Diagonal (Architectural Angle) -->
      <polygon points="174,222 222,146 258,146 194,236" fill="url(#orangeGlow)" />
      <!-- K Lower Diagonal -->
      <polygon points="186,226 264,286 226,286 166,242" fill="url(#orangeGlow)" />
    </g>

    <!-- "S" Letter (Modern Symmetrical Precision Cuts) -->
    <g>
      <!-- Top S Bar -->
      <path d="M280,172 C280,156 294,146 316,146 L362,146 C374,146 384,156 384,168 L384,178 L354,178 L354,172 L314,172 C308,172 306,175 306,179 C306,184 310,187 322,190 L358,198 C378,203 388,214 388,232 C388,244 382,255 372,263 C362,270 348,274 330,274 L282,274 C268,274 256,263 256,249 L256,238 L286,238 L286,248 L330,248 C337,248 340,245 340,241 C340,236 335,233 322,230 L288,222 C268,217 258,205 258,188 C258,176 266,165 280,158 Z" fill="#ffffff" />
      <!-- Dynamic S Speed Slice Accents -->
      <polygon points="274,206 370,186 364,196 268,216" fill="url(#orangeGlow)" />
      <polygon points="278,214 374,194 370,202 274,222" fill="url(#orangeGlow)" opacity="0.7" />
    </g>

    <!-- Lower Badge Banner: BUILDING DREAMS -->
    <g transform="translate(0, 318)">
      <rect x="110" y="0" width="292" height="34" rx="17" fill="url(#orangeGlow)" />
      <text x="256" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="2.2" text-anchor="middle">
        BUILDING DREAMS
      </text>
    </g>

    <!-- Top GPS Location Beacon Dot -->
    <circle cx="256" cy="88" r="7" fill="url(#orangeGlow)" />
    <circle cx="256" cy="88" r="16" fill="none" stroke="#f97316" stroke-width="2" opacity="0.6" />
  </g>
</svg>
