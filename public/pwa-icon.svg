<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tkoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Orange Gradient for TKO Accent -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#tkoBg)" />

  <!-- Subtle Outer Precision Ring -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="16 8" />

  <!-- Main Emblem Group with Shadow -->
  <g filter="url(#badgeShadow)">
    <!-- Hexagonal Field Shield -->
    <polygon points="256,48 432,120 432,320 256,448 80,320 80,120" fill="url(#shieldGrad)" stroke="#334155" stroke-width="6" />

    <!-- Inner Shield Border Accent -->
    <polygon points="256,66 414,131 414,310 256,425 98,310 98,131" fill="#0b1120" stroke="url(#blueGlow)" stroke-width="3" stroke-opacity="0.4" />

    <!-- Field Operations Grid Lines / Crosshairs -->
    <line x1="120" y1="240" x2="392" y2="240" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="256" y1="100" x2="256" y2="390" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="256" cy="240" r="110" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Stylized "TKO" Monogram Typography -->
    <!-- T Letter -->
    <g fill="#ffffff">
      <path d="M128,150 L204,150 L204,178 L180,178 L180,284 L152,284 L152,178 L128,178 Z" />
    </g>

    <!-- K Letter (with Orange Impact Bar) -->
    <g>
      <rect x="216" y="150" width="28" height="134" rx="4" fill="#ffffff" />
      <!-- K Diagonal Up -->
      <polygon points="244,222 284,150 318,150 262,236" fill="url(#orangeGlow)" />
      <!-- K Diagonal Down -->
      <polygon points="254,226 324,284 288,284 234,242" fill="url(#orangeGlow)" />
    </g>

    <!-- O Letter (Angular Precision Hexagon) -->
    <g>
      <polygon points="368,150 404,180 404,254 368,284 336,284 336,150" fill="#ffffff" opacity="0.0" />
      <path d="M362,150 L400,182 L400,252 L362,284 L340,284 L340,150 Z" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" />
      <!-- Center target dot inside O -->
      <circle cx="370" cy="217" r="10" fill="url(#orangeGlow)" />
    </g>

    <!-- FIELD OPERATIONS Badge Banner -->
    <g transform="translate(0, 316)">
      <rect x="130" y="0" width="252" height="34" rx="17" fill="url(#orangeGlow)" />
      <text x="256" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="2.5" text-anchor="middle">
        FIELD OPERATIONS
      </text>
    </g>

    <!-- Top GPS Location Beacon Dot -->
    <circle cx="256" cy="90" r="7" fill="url(#orangeGlow)" />
    <circle cx="256" cy="90" r="16" fill="none" stroke="#f97316" stroke-width="2" opacity="0.6" />
  </g>
</svg>
