<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Outer ring accent -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#60a5fa" stroke-width="8" stroke-opacity="0.25" />
  <!-- Construction Badge Group with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Shield Background -->
    <path d="M256,60 L410,120 L410,250 C410,360 256,450 256,450 C256,450 102,360 102,250 L102,120 Z" fill="#ffffff" />
    <!-- Inner Shield accent -->
    <path d="M256,80 L385,135 L385,245 C385,340 256,420 256,420 C256,420 127,340 127,245 L127,135 Z" fill="#f8fafc" />
    <!-- Hammer / Wrench crossed base handles -->
    <g stroke="#334155" stroke-width="20" stroke-linecap="round">
      <line x1="170" y1="310" x2="260" y2="220" />
      <line x1="342" y1="310" x2="252" y2="220" />
    </g>
    <!-- Hard Hat -->
    <path d="M170,220 C170,160 210,130 256,130 C302,130 342,160 342,220 Z" fill="#f59e0b" />
    <rect x="150" y="215" width="212" height="20" rx="10" fill="#d97706" />
    <!-- Helmet dot -->
    <circle cx="256" cy="165" r="12" fill="#d97706" />
  </g>
</svg>
