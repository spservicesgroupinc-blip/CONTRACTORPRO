<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ring accent -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.25" />

  <!-- Clock & Location Badge Group with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Map Pin background shape/outline -->
    <path d="M256,70 C160,70 82,148 82,244 C82,348 224,432 244,443.5 C251.5,447.8 260.5,447.8 268,443.5 C288,342 430,348 430,244 C430,148 352,70 256,70 Z" fill="#0f172a" />
    
    <!-- White Inner Core (representing the clean status / shield) -->
    <circle cx="256" cy="220" r="105" fill="#ffffff" />
    
    <!-- Orange Clock Hour Ring inside the core -->
    <circle cx="256" cy="220" r="85" fill="none" stroke="#f97316" stroke-width="12" />

    <!-- Clock Center Pin -->
    <circle cx="256" cy="220" r="14" fill="#0f172a" />
    
    <!-- Clock Hour Hand (pointing forward / to the 4 o'clock position for work) -->
    <line x1="256" y1="220" x2="310" y2="252" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    
    <!-- Clock Minute Hand (pointing up / to the 12 o'clock / straight up) -->
    <line x1="256" y1="220" x2="256" y2="155" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    
    <!-- Pulse Target Radiating rings below -->
    <ellipse cx="256" cy="442" rx="45" ry="12" fill="#0f172a" opacity="0.35" />
  </g>
</svg>
